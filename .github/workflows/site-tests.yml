name: Verify cooking website

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site.css'
      - 'offline-ready.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'site-data.js'
      - 'app.js'
      - 'local-backup.js'
      - 'food-safety.js'
      - 'cook-trial.js'
      - 'nutrition-coverage.js'
      - 'nutrient-ledger.js'
      - 'afcd3-selected.js'
      - 'afcd3-foods.js'
      - 'device-timer-check.js'
      - 'product-check.js'
      - 'food-shopping.js'
      - 'recipe-scale.js'
      - 'whole-day-data.js'
      - 'food-planner.js'
      - 'timers.js'
      - 'site-audit.js'
      - 'tests/**'
      - '.github/workflows/site-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'site.css'
      - 'offline-ready.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'site-data.js'
      - 'app.js'
      - 'local-backup.js'
      - 'food-safety.js'
      - 'cook-trial.js'
      - 'nutrition-coverage.js'
      - 'nutrient-ledger.js'
      - 'afcd3-selected.js'
      - 'afcd3-foods.js'
      - 'device-timer-check.js'
      - 'product-check.js'
      - 'food-shopping.js'
      - 'recipe-scale.js'
      - 'whole-day-data.js'
      - 'food-planner.js'
      - 'timers.js'
      - 'tests/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify website recipes, shopping arithmetic and app structure
        run: node --test tests/*.test.cjs
