name: Probe AFCD Release 3
on:
  push:
    branches: [main]
    paths:
      - 'scripts/afcd3_explore.py'
      - '.github/workflows/afcd3-probe.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Australian FSANZ food IDs and full nutrient-column names
        run: python scripts/afcd3_explore.py
