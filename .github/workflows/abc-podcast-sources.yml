name: Refresh official ABC podcast audio links
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_podcast_sources.py'
      - '.github/workflows/abc-podcast-sources.yml'
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Locate official ABC RSS audio URLs and validate dates
        run: python scripts/generate_podcast_sources.py
      - name: Store stable source references, never the audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast-streams.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh 16 official ABC podcast RSS audio links"
          git pull --rebase origin main
          git push origin HEAD:main
