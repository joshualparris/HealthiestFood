name: Verify independent Cloudflare music backup LIVE
on:
  push:
    branches: [main]
    paths:
      - 'tests/cloudflare-music-live.test.mjs'
      - '.github/workflows/cloudflare-music-live.yml'
  pull_request:
    paths:
      - 'tests/cloudflare-music-live.test.mjs'
      - '.github/workflows/cloudflare-music-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare deployed URL and unauthenticated access
        run: node --test tests/cloudflare-music-live.test.mjs
