name: Optimize uploaded recipe photographs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recipe-photo-conversion.yml'
      - 'file_*.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Convert seven original PNGs to efficient WebP
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          photos=json.loads(r'''{
  "a": "file_00000000a1f881faaedb673c5fc19b4d.png",
  "b": "file_00000000f71081fabf66c89ea0725c7b.png",
  "c": "file_0000000068fc81fa8113aca9fc6913da.png",
  "d": "file_000000002bf881fa8a89e5679d065eec.png",
  "sn-apple": "file_00000000ba8081fa93bc577873d68e5b.png",
  "sn-eggs": "file_00000000346081faad624b0be2f06b50.png",
  "sn-berries": "file_00000000f8e081faa47d69d898246e34.png"
}''')
          for recipe_id, source in photos.items():
              source_file=Path(source)
              assert source_file.is_file(), f"Missing uploaded image: {source}"
              destination=Path(recipe_id+'.webp')
              with Image.open(source_file) as original:
                  original.load()
                  assert original.width>=700 and original.height>=500, source
                  converted=original.convert("RGB")
                  if converted.width>1440:
                      new_height=round(converted.height*1440/converted.width)
                      converted=converted.resize((1440,new_height),Image.Resampling.LANCZOS)
                  converted.save(destination,'WEBP',quality=82,method=6)
              assert destination.stat().st_size>10000, destination
              print(f"{source_file} -> {destination} ({source_file.stat().st_size} -> {destination.stat().st_size} bytes)")
          PY
      - name: Commit optimized assets to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a.webp b.webp c.webp d.webp sn-apple.webp sn-eggs.webp sn-berries.webp
          if git diff --cached --quiet; then
            echo 'Recipe photographs are already optimized.'
          else
            git commit -m 'Optimize seven uploaded food photos as named WebP recipe assets'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
