name: Browser cooking journey

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'media-data.js'
      - 'media-library.js'
      - 'index.html'
      - 'site.css'
      - 'local-backup.js'
      - 'food-safety.js'
      - 'offline-ready.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'site-data.js'
      - 'afcd3-selected.js'
      - 'afcd3-foods.js'
      - 'nutrient-ledger.js'
      - 'nutrition-coverage.js'
      - 'device-timer-check.html'
      - 'device-timer-check.js'
      - 'product-check.html'
      - 'product-check.js'
      - 'food-shopping.js'
      - 'whole-day-data.js'
      - 'food-planner.js'
      - 'timers.js'
      - 'e2e/**'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Test mobile cooking, overlapping timers and meal shopping
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: node e2e/smoke.cjs
      - name: Check scaled steps, labelled nutrition and dynamic groceries in Chromium
        if: matrix.engine == 'chromium'
        run: node tests/browser-e2e.cjs

  production:
    needs: cross-browser
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual-browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify the latest live Render backup from mobile viewport (required)
        env:
          BROWSER_ENGINE: chromium
          SMOKE_URL: https://healthiest-food-backup.onrender.com
        run: node e2e/smoke.cjs
      - name: Check Vercel production separately (advisory while deployment quota is limited)
        continue-on-error: true
        env:
          BROWSER_ENGINE: chromium
          SMOKE_URL: https://healthiest-food.vercel.app
        run: node e2e/smoke.cjs
